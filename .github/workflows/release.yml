name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure release
        if: startsWith(github.ref, 'refs/tags/v')
        run: cmake -B build -A Win32 "-DVANILLAMINIMAPTRACKING_TAG=${{ github.ref_name }}"

      - name: Configure development build
        if: github.event_name == 'workflow_dispatch'
        run: cmake -B build -A Win32

      - name: Build
        run: cmake --build build --config Release

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Release/VanillaMinimapTracking.dll

      - name: Upload development build
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: VanillaMinimapTracking-${{ github.ref_name }}
          path: build/Release/VanillaMinimapTracking.dll
          if-no-files-found: error
